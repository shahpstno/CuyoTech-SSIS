<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuyoTech SSIS — Student Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Bookman Old Style', serif; }
        body { background-color: #f5f5f5; }
        .header { background-color: #0b3d2e; color: white; padding: 14px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h2 { font-size: 19px; }
        .user-area { display: flex; align-items: center; gap: 15px; }
        .logout-btn { background: white; color: #0b3d2e; padding: 8px 16px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .logout-btn:hover { background: #e8e8e8; }
        .wrapper { display: flex; min-height: calc(100vh - 60px); }
        .sidebar { width: 240px; background: white; padding: 30px 20px; box-shadow: 1px 0 3px rgba(0,0,0,0.05); }
        .sidebar a { display: block; padding: 12px 14px; margin-bottom: 8px; color: #333; text-decoration: none; border-radius: 4px; }
        .sidebar a:hover, .sidebar a.active { background: #e6f2ee; color: #0b3d2e; font-weight: bold; }
        .main-content { flex: 1; padding: 30px; }
        .welcome-text { font-size: 22px; margin-bottom: 30px; color: #0b3d2e; }
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 35px; }
        .stat-card { background: white; padding: 25px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .stat-card h3 { font-size: 14px; color: #666; margin-bottom: 10px; }
        .stat-number { font-size: 32px; font-weight: bold; color: #0b3d2e; }
        .section-title { font-size: 17px; margin: 20px 0 12px; color: #333; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        th, td { padding: 13px 18px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: bold; color: #0b3d2e; }
        .status-pending { color: #e67700; font-weight: bold; }
        .status-approved { color: #0b7a3f; font-weight: bold; }
        .status-rejected { color: #d32f2f; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h2>CuyoTech Student Services Information System</h2>
        <div class="user-area">
            <span id="userNameDisplay">Welcome</span>
            <a href="login.html" class="logout-btn" onclick="localStorage.clear()">Logout</a>
        </div>
    </div>


    <div class="wrapper">
        <div class="sidebar">
            <a href="dashboard.html" class="active">📋 Dashboard</a>
            <a href="documents.html">📄 Document Requests</a>
            <a href="#">💳 Payment Status</a>
            <a href="#">👤 My Profile</a>
            <a href="#">📊 Request History</a>
        </div>


        <div class="main-content">
            <h1 class="welcome-text">Student Dashboard</h1>


            <div class="cards-grid">
                <div class="stat-card">
                    <h3>Pending Requests</h3>
                    <p class="stat-number" id="pendingCount">0</p>
                </div>
                <div class="stat-card">
                    <h3>Approved</h3>
                    <p class="stat-number" id="approvedCount">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Requests</h3>
                    <p class="stat-number" id="totalCount">0</p>
                </div>
            </div>


            <h3 class="section-title">Your Recent Requests</h3>
            <table id="requestsTable">
                <tr>
                    <th>Document</th>
                    <th>Date Requested</th>
                    <th>Status</th>
                </tr>
            </table>
        </div>
    </div>


    <script>
        const name = localStorage.getItem('loggedInName');
        const role = localStorage.getItem('userRole');
       
        if (!name || role !== 'student') {
            window.location.href = 'login.html';
        } else {
            document.getElementById('userNameDisplay').textContent = `Welcome, ${name}`;
        }


        function loadStudentRequests() {
            const allRequests = JSON.parse(localStorage.getItem('allRequests') || '[]');
            const myRequests = allRequests.filter(r => r.studentName === name);
           
            document.getElementById('pendingCount').textContent = myRequests.filter(r => r.status === 'Pending').length;
            document.getElementById('approvedCount').textContent = myRequests.filter(r => r.status === 'Approved').length;
            document.getElementById('totalCount').textContent = myRequests.length;


            const table = document.getElementById('requestsTable');
            table.innerHTML = `<tr><th>Document</th><th>Date Requested</th><th>Status</th></tr>`;
           
            myRequests.forEach(r => {
                const statusClass = r.status === 'Pending' ? 'status-pending' :
                                   r.status === 'Approved' ? 'status-approved' :
                                   r.status === 'Rejected' ? 'status-rejected' : '';
                table.innerHTML += `
                    <tr>
                        <td>${r.documentType}</td>
                        <td>${r.date}</td>
                        <td class="${statusClass}">${r.status}</td>
                    </tr>
                `;
            });
        }


        loadStudentRequests();
    </script>
</body>
</html>
