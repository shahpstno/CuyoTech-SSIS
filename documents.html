<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuyoTech SSIS — Document Requests</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Bookman Old Style', serif; }
        body { background-color: #f5f5f5; }
        .header { background-color: #0b3d2e; color: white; padding: 14px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h2 { font-size: 19px; }
        .user-area { display: flex; align-items: center; gap: 15px; }
        .logout-btn { background: white; color: #0b3d2e; padding: 8px 16px; border-radius: 4px; text-decoration: none; font-weight: bold; }
        .wrapper { display: flex; min-height: calc(100vh - 60px); }
        .sidebar { width: 240px; background: white; padding: 30px 20px; box-shadow: 1px 0 3px rgba(0,0,0,0.05); }
        .sidebar a { display: block; padding: 12px 14px; margin-bottom: 8px; color: #333; text-decoration: none; border-radius: 4px; }
        .sidebar a:hover, .sidebar a.active { background: #e6f2ee; color: #0b3d2e; font-weight: bold; }
        .main-content { flex: 1; padding: 30px; }
        .page-title { font-size: 22px; margin-bottom: 25px; color: #0b3d2e; }
        .form-card { background: white; padding: 30px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); margin-bottom: 35px; }
        .form-row { display: flex; gap: 20px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 200px; margin-bottom: 20px; }
        .form-group.full-width { flex: 100%; }
        label { display: block; margin-bottom: 7px; font-weight: 600; color: #333; }
        input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
        button { background-color: #0b3d2e; color: white; border: none; padding: 12px 30px; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #145c47; }
        .section-title { font-size: 17px; margin-bottom: 12px; color: #333; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        th, td { padding: 13px 18px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: bold; color: #0b3d2e; }
        .status-pending { color: #e67700; font-weight: bold; }
        .status-approved { color: #0b7a3f; font-weight: bold; }
        .status-rejected { color: #d32f2f; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h2>CuyoTech Student Services Information System</h2>
        <div class="user-area">
            <span id="userNameDisplay">Welcome</span>
            <a href="login.html" class="logout-btn">Logout</a>
        </div>
    </div>


    <div class="wrapper">
        <div class="sidebar">
            <a href="dashboard.html">📋 Dashboard</a>
            <a href="documents.html" class="active">📄 Document Requests</a>
            <a href="#">💳 Payment Status</a>
            <a href="#">👤 My Profile</a>
            <a href="#">📊 Request History</a>
        </div>


        <div class="main-content">
            <h1 class="page-title">📄 Request a Document</h1>


            <div class="form-card">
                <form onsubmit="submitRequest(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="docType">Document Type</label>
                            <select id="docType" required>
                                <option value="">-- Select Document --</option>
                                <option>Form 137</option>
                                <option>Transcript of Records</option>
                                <option>Certificate of Enrollment</option>
                                <option>Certificate of Good Moral</option>
                                <option>Honorable Dismissal</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="copies">Number of Copies</label>
                            <input type="number" id="copies" min="1" value="1" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group full-width">
                            <label for="purpose">Purpose</label>
                            <textarea id="purpose" rows="3" placeholder="State purpose of request..." required></textarea>
                        </div>
                    </div>
                    <button type="submit">SUBMIT REQUEST</button>
                </form>
            </div>


            <h3 class="section-title">Your Requests</h3>
            <table id="myRequestsTable">
                <tr>
                    <th>Document</th>
                    <th>Date Requested</th>
                    <th>Purpose</th>
                    <th>Status</th>
                </tr>
            </table>
        </div>
    </div>


    <script>
        const studentName = localStorage.getItem('loggedInName');
        const role = localStorage.getItem('userRole');
       
        if (!studentName || role !== 'student') {
            window.location.href = 'login.html';
        } else {
            document.getElementById('userNameDisplay').textContent = `Welcome, ${studentName}`;
        }


        function submitRequest(e) {
            e.preventDefault();
           
            const docType = document.getElementById('docType').value;
            const purpose = document.getElementById('purpose').value;
            const today = new Date();
            const dateStr = today.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });


            const newRequest = {
                id: Date.now(),
                studentName: studentName,
                documentType: docType,
                purpose: purpose,
                date: dateStr,
                status: 'Pending'
            };


            // I-save sa ALL REQUESTS — dito nakikita ng Admin
            const allRequests = JSON.parse(localStorage.getItem('allRequests') || '[]');
            allRequests.push(newRequest);
            localStorage.setItem('allRequests', JSON.stringify(allRequests));


            alert('✅ Request Submitted! Admin can now see it.');
            e.target.reset();
            loadMyRequests();
        }


        function loadMyRequests() {
            const allRequests = JSON.parse(localStorage.getItem('allRequests') || '[]');
            const myRequests = allRequests.filter(r => r.studentName === studentName);
            const table = document.getElementById('myRequestsTable');
           
            table.innerHTML = `<tr><th>Document</th><th>Date Requested</th><th>Purpose</th><th>Status</th></tr>`;
           
            myRequests.forEach(r => {
                const statusClass = r.status === 'Pending' ? 'status-pending' :
                                   r.status === 'Approved' ? 'status-approved' :
                                   r.status === 'Rejected' ? 'status-rejected' : '';
                table.innerHTML += `
                    <tr>
                        <td>${r.documentType}</td>
                        <td>${r.date}</td>
                        <td>${r.purpose}</td>
                        <td class="${statusClass}">${r.status}</td>
                    </tr>
                `;
            });
        }


        loadMyRequests();
    </script>
</body>
</html>
